# coturn relay for Harmony direct calls (deploy/coturn/LEIAME.md).
#
# Everything static lives here. Per-instance settings come from
# .env via the container command line in docker-compose.yml:
#   --static-auth-secret=$TURN_SECRET
#   --listening-ip=$TURN_PRIVATE_IP
#   --relay-ip=$TURN_PRIVATE_IP
#   --external-ip=$TURN_PUBLIC_IP/$TURN_PRIVATE_IP (Oracle does 1:1 NAT)
#
# Single-file bind mount: after editing this file run
#   docker compose up -d --force-recreate coturn
# Recreating the container refreshes its single-file bind mount.

listening-port=3478

# listening-ip and relay-ip come from the command line (TURN_PRIVATE_IP).
# Without them coturn also binds the Docker bridges (172.17/172.18) and
# round-robins allocations across every relay address, so two out of three
# allocations would advertise an unreachable relay. When the VCN gets IPv6,
# add a second --listening-ip/--relay-ip pair for the global v6 address
# (no external-ip needed for v6: there is no NAT).

# Ephemeral credentials (RFC-style REST API): username "<exp>:<user>",
# password base64(HMAC-SHA1(secret, username)). Minted by Harmony through
# internal/turn. No user database, no static users.
use-auth-secret
realm=call.taleshernandes.com
fingerprint
stale-nonce=600

# Relay port range. Small on purpose: two people, a handful of allocations.
# No user/total quotas: with per-connection credentials and a 41-port range
# they add nothing, and coturn 4.17 answered 486 to a plain single-user test
# with them on.
# Must match the Security List + iptables rules (docs/DEPLOY.md, Sprint 4).
min-port=49160
max-port=49200

# Plain turn: over UDP and TCP only. TURNS is deferred: this image runs as
# `nobody` and cannot read Caddy's key, and 5349 does not beat 443-only
# firewalls anyway. When it lands, uncomment and point at the cert/key:
#tls-listening-port=5349
#cert=/certs/call.taleshernandes.com.crt
#pkey=/certs/call.taleshernandes.com.key
no-tls
# (no DTLS listener either: since 4.17 it only starts with an explicit --dtls.)

# The relay must never reach the instance itself, the Oracle VCN, or any
# private/link-local range. Media goes browser↔browser only.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
denied-peer-ip=2001::-2001:1ff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Surface reduction. No RFC 5780 NAT-discovery extras, no software banner in
# STUN responses. The telnet CLI is off by default since 4.17 (no-cli is
# gone); no-tlsv1 / no-tlsv1_1 are gone too, TLS 1.0/1.1 left the build.
no-rfc5780
no-software-attribute

# Logs go to the container's stdout (docker compose logs coturn). Connection
# events only; coturn never sees media in the clear (DTLS-SRTP end to end).
log-file=stdout
simple-log
